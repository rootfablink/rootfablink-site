services:
  postgres:
    image: postgres:16
    container_name: rootfablink-postgres
    environment:
      POSTGRES_USER: rootfablink
      POSTGRES_PASSWORD: rootfablink
      POSTGRES_DB: rootfablink
    ports:
      - "5432:5432"
    volumes:
      - rootfablink-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: rootfablink-redis
    ports:
      - "6379:6379"

volumes:
  rootfablink-postgres:
